<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Acceptance Letter - Birthday Celebration</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-bg: #f4ecdc;
            --parchment-border: #d4c5a9;
            --ink-color: #2c221e;
            --envelope-color: #e6dfcb;
            --envelope-flap: #d6cebc;
            --wax-red: #990000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121620;
            background-image: radial-gradient(circle at center, #1e2536 0%, #0c0f17 100%);
            font-family: 'Playfair Display', serif;
            color: var(--ink-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .scene {
            width: 100%;
            max-width: 550px;
            height: 360px;
            perspective: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .envelope-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.6));
            cursor: pointer;
        }

        .envelope-wrapper.flipped {
            transform: rotateY(180deg);
        }

        .envelope-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-color: var(--envelope-color);
            border-radius: 6px;
            border: 2px solid #c8bc9d;
            user-select: none;
            top: 0;
            left: 0;
        }

        .envelope-front {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ede6d3 0%, #dfd6be 100%);
            padding: 30px;
            z-index: 2;
            transform: rotateY(0deg);
        }

        .address-lines {
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            line-height: 1.8;
            color: #3b2f2f;
            text-align: left;
            width: 100%;
            padding-left: 15%;
            letter-spacing: 1px;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .envelope-wrapper.flipped .address-lines {
            opacity: 0;
        }

        .envelope-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, #dfd6be 0%, #d2c8ae 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1;
        }

        .envelope-flap-triangle {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 275px solid transparent;
            border-right: 275px solid transparent;
            border-top: 180px solid var(--envelope-flap);
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 3;
            pointer-events: none;
        }

        .envelope-wrapper.open .envelope-flap-triangle {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .wax-seal {
            width: 85px;
            height: 85px;
            background: radial-gradient(circle, #cc0000 0%, var(--wax-red) 70%, #660000 100%);
            border-radius: 50%;
            position: absolute;
            top: 130px;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 3px rgba(255,255,255,0.3);
            border: 2px dashed rgba(255,215,0,0.4);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .wax-seal:hover {
            transform: scale(1.08);
        }

        .wax-seal span {
            font-family: 'Cinzel', serif;
            font-size: 2.3rem;
            color: #ffebcd;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        .tap-instruction {
            color: #c5cbd3;
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            margin-top: 25px;
            letter-spacing: 2px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        .letter-container {
            position: absolute;
            width: 90%;
            max-width: 620px;
            max-height: 88vh;
            background: var(--parchment-bg);
            background-image: radial-gradient(circle, rgba(244,236,220,0.95) 0%, rgba(224,210,185,0.95) 100%);
            border: 3px solid var(--parchment-border);
            border-radius: 4px;
            padding: 40px 45px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            overflow-y: auto;
            display: none;
            z-index: 10;
            opacity: 0;
            transform: translateY(40px);
            transition: all 1s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .letter-container.visible {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .crest-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .crest-header img {
            width: 90px;
            height: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .school-header {
            text-align: center;
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: #3b2f2f;
            margin-bottom: 25px;
            line-height: 1.5;
            font-weight: 700;
        }

        .letter-body {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--ink-color);
        }

        .letter-body p {
            margin-bottom: 18px;
